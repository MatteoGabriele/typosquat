name: Typosquat Guard

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - id: guard
        uses: MatteoGabriele/typosquat@v1
        with:
          protect: |
            acme-release-bot
            acme-security
          fail-on: high

      - name: Notify security channel
        if: steps.guard.outputs.risk == 'critical'
        run: echo "${{ steps.guard.outputs.actor }} resembles ${{ steps.guard.outputs.resembles }}"
