name: Typosquat Guard

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - id: guard
        uses: MatteoGabriele/typosquat@94e108d28b61ca997a51eba4acfea68a369b23fe
        with:
          protect: |
            acme-release-bot
            acme-security
          # full (the default) comments on the thread and labels it.
          # labels / comment do one of the two; silent does neither.
          mode: full
          # A lookalike is reported, not blocked, unless this is turned on.
          fail-on-match: false

      - name: Notify security channel
        if: steps.guard.outputs.risk == 'critical'
        run: echo "${{ steps.guard.outputs.actor }} resembles ${{ steps.guard.outputs.resembles }}"

      # risk answers one question: could someone land on this name by accident?
      #
      #   critical  the name was copied; nobody types it by accident
      #   high      one slip away from the real name: typo, or cheap fake
      #   medium    the real name with extra words around it (forks look like this)
      #   low       vaguely similar, two characters off
      #
      # mode decides what the thread is told, fail-on-match whether the job
      # goes red (off by default). risk and rule are set whatever those say, so
      # a workflow can act on them itself, as the steps below do.
      #
      # `rule` names which resemblance matched, so a workflow can treat a copied
      # name differently from a plausible typo:
      #
      #   critical  bot-base-name-squat    dependabot          -> dependabot[bot]
      #   critical  digit-substitution     dependab0t          -> dependabot[bot]
      #   critical  bot-affix-variant      renovate-bot        -> renovate[bot]
      #   critical  authority-affix        the-real-danielroe  -> danielroe
      #   critical  separator-variant      depend-a-bot        -> dependabot[bot]
      #   critical  digraph-lookalike      tarnerlinsley       -> tannerlinsley
      #   high      doubled-character      dependabbot         -> dependabot[bot]
      #   high      single-character-edit  danieleroe          -> danielroe
      #   high      character-swap         depenbadot          -> dependabot[bot]
      #   medium    affix-wrap             dependabot-mirror   -> dependabot[bot]
      #   low       near-miss              4308ik              -> 43081j
      #
      # A login you cannot read by eye (yyx990803, 43081j) counts one level
      # higher, so a single-character-edit against one of those is critical.
      - name: Lock the thread on a claimed identity
        if: >-
          steps.guard.outputs.rule == 'bot-base-name-squat' ||
          steps.guard.outputs.rule == 'authority-affix'
        run: gh issue lock ${{ github.event.issue.number }} --reason spam
        env:
          GH_TOKEN: ${{ github.token }}
