name: 'Typosquat'
description: 'Flags lookalike usernames trying to pass as trusted bots or maintainers.'
author: 'MatteoGabriele'
branding:
  icon: 'user-x'
  color: 'orange'

inputs:
  github-token:
    description: 'Token used to list repository contributors.'
    required: false
    default: ${{ github.token }}
  protect:
    description: 'Extra logins to defend, comma- or newline-separated.'
    required: false
    default: ''
  allow:
    description: 'Logins that must never be flagged, comma- or newline-separated.'
    required: false
    default: ''
  mode:
    description: "How Typosquat should act on a lookalike: 'full' (comment and label), 'labels' (label only), 'comment' (comment only), or 'silent' (outputs and annotation only, no comment or label)."
    required: false
    default: 'full'
  fail-on-match:
    description: 'Whether a lookalike fails the job. False by default; the match is reported either way.'
    required: false
    default: 'false'
  label:
    description: 'Label to add when the author resembles a protected login.'
    required: false
    default: 'typosquat:lookalike'

outputs:
  actor:
    description: 'The login that was checked.'
  risk:
    description: 'How likely the name is a fake: none, low, medium, high or critical.'
  score:
    description: 'Score 0-100. A tiebreaker; use risk to decide.'
  resembles:
    description: 'The protected login the author resembles, empty when there is no match.'
  rule:
    description: 'Which rule matched, empty when there is no match.'

runs:
  using: 'node20'
  main: 'dist/index.mjs'
